<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <!-- Space Grotesk itself is requested from index.css; preconnecting here
             starts the TLS handshake before the CSS has even parsed. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Matches --seed-page of the default Midnight theme. -->
        <meta name="theme-color" content="#0b0b10" />
        <meta
            name="description"
            content="Evan Czako — fullstack developer. Portfolio of music and audio web apps: DoughLoops, ChordFinder and SynthPutty."
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Evan Czako — Fullstack Developer" />
        <meta
            property="og:description"
            content="Portfolio of music and audio web apps: DoughLoops, ChordFinder and SynthPutty."
        />
        <meta property="og:url" content="https://evanczako.com/" />
        <meta property="og:site_name" content="Evan Czako" />
        <!-- Absolute, not %PUBLIC_URL%-relative: the fetch is made by Slack's
             or LinkedIn's scraper, which has no base URL to resolve against.
             Regenerate the image itself with `npm run og`. -->
        <meta property="og:image" content="https://evanczako.com/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Evan Czako, fullstack developer — DoughLoops, ChordFinder and SynthPutty."
        />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="canonical" href="https://evanczako.com/" />
        <title>Evan Czako — Fullstack Developer</title>
        <!-- Feeds the name-query result. sameAs is the list of profiles Google
             uses to confirm these accounts are the same person. -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Evan Czako",
                "url": "https://evanczako.com/",
                "jobTitle": "Fullstack Developer",
                "alumniOf": "Cornell University",
                "knowsAbout": ["React", "TypeScript", "Web Audio", "MATLAB"],
                "sameAs": [
                    "https://github.com/EvanCzako",
                    "https://www.linkedin.com/in/evan-czako/",
                    "https://www.mathworks.com/matlabcentral/profile/authors/13527609"
                ]
            }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
